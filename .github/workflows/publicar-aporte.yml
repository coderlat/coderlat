name: Publicar aporte
# Se ejecuta tras el merge a main: copia el aporte al repo de contenido y lo quita del buzón.
on:
  push:
    branches: [main]
    paths: ['aportes/**']

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Buzón (este repo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PUBLICAR_TOKEN }}

      - name: Repo de contenido (el que lee el sitio)
        uses: actions/checkout@v4
        with:
          repository: porquero/coderlat-contenido
          token: ${{ secrets.PUBLICAR_TOKEN }}
          path: contenido

      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pyyaml

      - name: Preparar aportes
        env:
          BEFORE: ${{ github.event.before }}
          OWNER: porquero
        run: python .github/scripts/publicar.py

      - name: Publicar en el repo de contenido
        working-directory: contenido
        run: |
          git config user.name "coderlat-bot"
          git config user.email "bot@coderlat.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Publica aportes (${GITHUB_SHA::7})"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Quitar del buzón lo ya publicado
        run: |
          if [ -s "$RUNNER_TEMP/publicados.txt" ]; then
            git config user.name "coderlat-bot"
            git config user.email "bot@coderlat.com"
            while read -r s; do git rm -r -q "aportes/$s"; done < "$RUNNER_TEMP/publicados.txt"
            git commit -m "Aportes publicados [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Fallar si algún aporte no se pudo publicar
        run: |
          if [ -s "$RUNNER_TEMP/errores.txt" ]; then
            echo "::error::Aportes sin publicar:"; cat "$RUNNER_TEMP/errores.txt"; exit 1
          fi
